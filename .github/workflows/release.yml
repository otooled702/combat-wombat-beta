# Push a tag like v0.9.0-beta.1 to publish a release with the built files.
# Tags with a hyphen (beta, rc) are marked as pre-releases. Notes come from docs/releases/<tag>.md.
name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 build.py --check
      - name: Check the tag matches the app version
        run: |
          v=$(grep -oP "var APP_VERSION='\K[^']+" src/js/01-constants-and-static-data.js)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $v"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/$tag.md"; [ -f "$notes" ] || notes=/dev/null
          pre=""; case "$tag" in *-*) pre="--prerelease";; esac
          cp dist/beta.html "combat-wombat-$tag-beta.html"
          cp dist/demo.html "combat-wombat-$tag-demo.html"
          cp dist/initiative-tracker.html "combat-wombat-$tag.html"
          gh release create "$tag" $pre --title "Combat Wombat $tag" --notes-file "$notes" \
            "combat-wombat-$tag-beta.html" "combat-wombat-$tag-demo.html" "combat-wombat-$tag.html"
